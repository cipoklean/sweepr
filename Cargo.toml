[package]
name = "sweepr"
version = "0.2.0"
edition = "2021"
description = "Find the junk your dev work left behind, sorted into safe-to-clean and needs-you."
license = "MIT"
readme = "README.md"
keywords = ["cleanup", "disk", "node_modules", "cache", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
